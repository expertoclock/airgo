name: airgo-project

services:
  airgo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airgo_app
    image: airgo:latest
    # Using host mode avoids the corrupted Docker NAT/iptables chains
    network_mode: host
    environment:
      - GIN_MODE=release
      - PORT=8081
      - UPLOAD_PATH=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  tunnel:
    image: cloudflare/cloudflared:latest
    # Points to localhost because both are on the host network
    command: tunnel --url http://localhost:8081 --no-autoupdate
    network_mode: host
    restart: unless-stopped
    depends_on:
      - airgo