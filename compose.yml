name: airgo-project

services:
  airgo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airgo_app
    image: airgo:latest
    ports:
      - "8081:8080"
    environment:
      - GIN_MODE=release
      - PORT=8080
      - UPLOAD_PATH=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]

  # The Significant Change: Cloudflare Tunnel
  # This creates a public URL for your local app
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://airgo:8080 --no-autoupdate
    restart: unless-stopped
    depends_on:
      - airgo

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
