<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirGo | Refined</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151f32',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        accent: {
                            blue: '#3b82f6',
                            indigo: '#6366f1',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }

        body {
            background-color: #0f172a;
            background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .glass-card:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.3); }

    </style>
</head>
<body x-data="airgoApp()">

    <!-- Main Container -->
    <div class="relative min-h-screen flex flex-col p-6 md:p-10 max-w-[1400px] mx-auto">

        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="flex items-center gap-4">
                <div class="relative w-12 h-12 bg-slate-800 rounded-xl flex items-center justify-center border border-white/5 shadow-lg" @click="fetchStats(); fetchFiles()">
                    <i class="fa-solid fa-wind text-xl text-blue-400"></i>
                </div>
                <div>
                    <h1 class="font-display font-semibold text-2xl tracking-tight text-white">AirGo</h1>
                    <div class="flex items-center gap-2 text-xs font-medium text-slate-400">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        <span x-text="stats.uptime || 'Online'"></span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                 <!-- Stats Pill -->
                <div class="hidden md:flex bg-slate-800/50 border border-white/5 rounded-full px-5 py-2 items-center gap-6">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-database text-slate-500 text-xs"></i>
                        <span class="text-xs font-mono text-slate-300" x-text="stats.total_size || '0 B'"></span>
                    </div>
                    <div class="w-px h-3 bg-white/10"></div>
                     <div class="flex items-center gap-2">
                        <i class="fa-regular fa-file text-slate-500 text-xs"></i>
                         <span class="text-xs font-mono text-slate-300" x-text="stats.file_count || '0'"></span>
                    </div>
                </div>

                <button @click="showQRModal = true" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-900/20 flex items-center gap-2">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <span>Connect</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1 items-start">

            <!-- Left Sidebar (Upload & Actions) -->
            <div class="lg:col-span-4 flex flex-col gap-6 sticky top-6">
                <!-- Dropzone -->
                <div
                    @dragover.prevent="isDragging = true"
                    @dragleave.prevent="isDragging = false"
                    @drop.prevent="handleDrop($event)"
                    class="glass-panel rounded-2xl p-1 relative overflow-hidden group transition-all duration-300"
                    :class="{'border-blue-500 ring-2 ring-blue-500/20': isDragging}"
                >
                    <div class="bg-slate-900/30 rounded-[12px] p-8 flex flex-col items-center justify-center text-center border border-dashed border-slate-700 min-h-[280px] hover:border-slate-500 transition-colors relative z-10">
                        <input type="file" id="fileInput" class="hidden" @change="handleFileSelect($event)">

                        <div x-show="!uploading" class="space-y-5">
                            <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-800 flex items-center justify-center shadow-inner group-hover:scale-105 transition-transform duration-300">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl text-blue-400 group-hover:animate-bounce"></i>
                            </div>
                            <div>
                                <h3 class="font-display font-medium text-lg text-white mb-1">Upload Files</h3>
                                <p class="text-sm text-slate-400">Drag & drop or <button class="text-blue-400 hover:text-blue-300 font-medium" @click="document.getElementById('fileInput').click()">browse</button></p>
                            </div>
                        </div>

                        <!-- Upload Progress -->
                        <div x-show="uploading" class="w-full text-center" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
                             <div class="mb-4 flex justify-between text-xs font-medium text-slate-400">
                                <span class="truncate max-w-[150px]" x-text="currentFileName"></span>
                                <span x-text="progress + '%'"></span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                                <div class="bg-blue-500 h-2 rounded-full transition-all duration-300" :style="`width: ${progress}%`"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Selection Actions -->
                <div x-show="selectedFiles.length > 0" x-transition class="glass-panel p-5 rounded-2xl border-l-4 border-l-blue-500">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm font-medium text-white"><span x-text="selectedFiles.length"></span> item(s) selected</span>
                        <button @click="selectedFiles = []" class="text-xs text-slate-400 hover:text-white">Clear</button>
                    </div>
                    <button @click="batchDelete" class="w-full py-2.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500 hover:text-white transition-all font-medium text-sm flex items-center justify-center gap-2">
                        <i class="fa-regular fa-trash-can"></i> Delete Selected
                    </button>
                </div>
            </div>

            <!-- Right Content (File Browser) -->
            <div class="lg:col-span-8 flex flex-col gap-6">

                <!-- Toolbar -->
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                    <!-- Search -->
                    <div class="relative w-full sm:max-w-md group">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-500 group-focus-within:text-blue-400 transition-colors text-sm"></i>
                        <input type="text" x-model="search" placeholder="Search files..." class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/20 transition-all">
                    </div>

                    <!-- View Toggle -->
                    <div class="flex bg-slate-800/50 p-1 rounded-lg border border-slate-700/50">
                        <button @click="viewMode = 'grid'" class="px-3 py-1.5 rounded-md text-sm transition-all" :class="viewMode === 'grid' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-500 hover:text-slate-300'">
                            <i class="fa-solid fa-grip"></i>
                        </button>
                        <button @click="viewMode = 'list'" class="px-3 py-1.5 rounded-md text-sm transition-all" :class="viewMode === 'list' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-500 hover:text-slate-300'">
                            <i class="fa-solid fa-list"></i>
                        </button>
                    </div>
                </div>

                <!-- File Grid -->
                <div class="relative min-h-[200px]">
                    <!-- Loading Skeleton -->
                    <div x-show="isLoading" class="grid grid-cols-2 md:grid-cols-3 gap-4 absolute inset-0">
                        <template x-for="i in 6">
                            <div class="glass-card rounded-xl p-4 animate-pulse">
                                <div class="w-10 h-10 bg-slate-700/50 rounded-lg mb-4"></div>
                                <div class="h-4 bg-slate-700/50 rounded w-3/4 mb-2"></div>
                                <div class="h-3 bg-slate-700/50 rounded w-1/2"></div>
                            </div>
                        </template>
                    </div>

                    <!-- Files -->
                    <div x-show="!isLoading" :class="viewMode === 'grid' ? 'grid grid-cols-2 sm:grid-cols-3 gap-4' : 'flex flex-col gap-2'">
                        <template x-for="file in filteredFiles" :key="file.name">
                            <div class="glass-card rounded-xl p-4 group relative cursor-pointer"
                                 :class="{'ring-1 ring-blue-500 bg-blue-500/5': selectedFiles.includes(file.name), 'flex items-center gap-4': viewMode === 'list'}"
                                 @click="toggleSelect(file.name)">

                                <!-- Selection Indicator -->
                                <div x-show="selectedFiles.includes(file.name)" class="absolute top-3 right-3 w-4 h-4 bg-blue-500 rounded text-center flex items-center justify-center shadow-sm z-20">
                                    <i class="fa-solid fa-check text-[10px] text-white"></i>
                                </div>

                                <!-- Icon -->
                                <div class="w-12 h-12 rounded-lg bg-slate-800/80 border border-white/5 flex items-center justify-center text-xl shrink-0 text-slate-400 group-hover:text-blue-400 transition-colors">
                                    <i :class="getFileIcon(file.name)"></i>
                                </div>

                                <!-- Details -->
                                <div class="min-w-0 flex-1" :class="{'mt-4': viewMode === 'grid'}">
                                    <h4 class="text-sm font-medium text-slate-200 truncate group-hover:text-white transition-colors" x-text="file.name"></h4>
                                    <div class="flex items-center gap-2 mt-1.5">
                                        <p class="text-[11px] text-slate-500 font-mono tracking-wide" x-text="file.size"></p>
                                        <span class="w-0.5 h-0.5 rounded-full bg-slate-600"></span>
                                        <p class="text-[11px] text-slate-500" x-text="timeAgo(file.mod_time)"></p>
                                    </div>
                                </div>

                                <!-- Hover Actions -->
                                <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-200 rounded-xl flex items-center justify-center gap-2 z-10" @click.stop>
                                    <button @click="copyToClipboard(file.url)" class="w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 text-white flex items-center justify-center border border-white/10 transition-colors" title="Copy Link">
                                        <i class="fa-regular fa-copy text-sm"></i>
                                    </button>
                                    <a :href="file.url" download class="w-9 h-9 rounded-lg bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/20 transition-colors" title="Download">
                                        <i class="fa-solid fa-download text-sm"></i>
                                    </a>
                                    <button @click="deleteFile(file.name)" class="w-9 h-9 rounded-lg bg-red-500/10 hover:bg-red-500/80 hover:text-white text-red-500 border border-red-500/20 flex items-center justify-center transition-colors" title="Delete">
                                        <i class="fa-regular fa-trash-can text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        </template>

                         <!-- Empty State -->
                        <div x-show="filteredFiles.length === 0 && !isLoading" class="col-span-full py-16 text-center flex flex-col items-center justify-center opacity-40">
                            <i class="fa-regular fa-folder-open text-3xl mb-3 text-slate-400"></i>
                            <p class="text-sm text-slate-500 font-medium h-4">No files found</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- QR Modal -->
    <div x-show="showQRModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         @click.self="showQRModal = false" @keydown.escape.window="showQRModal = false">

        <div class="glass-panel p-6 rounded-2xl max-w-sm w-full relative text-center border shadow-2xl">
            <button @click="showQRModal = false" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h3 class="font-display font-semibold text-xl text-white mb-6">Mobile Access</h3>

            <div class="bg-white p-3 rounded-xl inline-block shadow-lg mb-6">
                <div id="qrcode"></div>
            </div>

            <div class="bg-slate-800/50 rounded-lg p-3 flex items-center justify-between gap-3 text-left group cursor-pointer hover:bg-slate-800 transition-colors" @click="copyToClipboard(window.location.href)">
                <div class="min-w-0">
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Local URL</p>
                    <p class="text-xs font-mono text-blue-400 truncate" x-text="window.location.href"></p>
                </div>
                <i class="fa-regular fa-copy text-slate-500 group-hover:text-white"></i>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.visible"
                 x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 translate-y-2"
                 class="bg-slate-800 border border-white/10 px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 min-w-[280px]">
                <i :class="toast.type === 'success' ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-circle-exclamation text-red-500'"></i>
                <span class="text-sm font-medium text-white" x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <script>
        function airgoApp() {
            return {
                files: [], search: '', stats: {}, isDragging: false,
                uploading: false, progress: 0, currentFileName: '', isLoading: true,
                toasts: [], showQRModal: false, viewMode: 'grid', selectedFiles: [],

                init() {
                    this.refreshAll();
                    setInterval(() => { this.fetchStats(); this.fetchFiles(); }, 5000);

                    this.$watch('showQRModal', (val) => {
                        if (val) {
                            this.$nextTick(() => {
                                document.getElementById('qrcode').innerHTML = "";
                                new QRCode(document.getElementById("qrcode"), {
                                    text: window.location.href, width: 160, height: 160,
                                    colorDark: "#020617", colorLight: "#ffffff",
                                    correctLevel: QRCode.CorrectLevel.M
                                });
                            });
                        }
                    });
                },

                refreshAll() { this.fetchFiles(); this.fetchStats(); },

                get filteredFiles() {
                    if (!this.search) return this.files;
                    return this.files.filter(f => f.name.toLowerCase().includes(this.search.toLowerCase()));
                },

                toggleSelect(name) {
                    if (this.selectedFiles.includes(name)) {
                        this.selectedFiles = this.selectedFiles.filter(i => i !== name);
                    } else {
                        this.selectedFiles.push(name);
                    }
                },

                handleDrop(e) {
                    this.isDragging = false;
                    if (e.dataTransfer.files.length) this.uploadFile(e.dataTransfer.files[0]);
                },

                handleFileSelect(e) {
                    if (e.target.files.length) this.uploadFile(e.target.files[0]);
                },

                uploadFile(file) {
                    this.uploading = true;
                    this.progress = 0;
                    this.currentFileName = file.name;

                    const fd = new FormData();
                    fd.append('file', file);

                    axios.post('/api/upload', fd, {
                        onUploadProgress: (p) => this.progress = Math.round((p.loaded * 100) / p.total)
                    })
                    .then(() => {
                        this.showToast('Upload complete', 'success');
                        this.refreshAll();
                    })
                    .catch(() => this.showToast('Upload failed', 'error'))
                    .finally(() => setTimeout(() => this.uploading = false, 800));
                },

                batchDelete() {
                    if (!confirm(`Delete ${this.selectedFiles.length} files?`)) return;

                    Promise.all(this.selectedFiles.map(name => axios.delete(`/api/files/${name}`)))
                        .then(() => {
                            this.showToast(`${this.selectedFiles.length} files deleted`, 'success');
                            this.selectedFiles = [];
                            this.refreshAll();
                        });
                },

                deleteFile(name) {
                    if(!confirm('Delete this file?')) return;
                    axios.delete(`/api/files/${name}`).then(() => {
                        this.showToast('File deleted', 'success');
                        this.refreshAll();
                    });
                },

                copyToClipboard(text) {
                    const content = text.startsWith('/') ? window.location.origin + text : text;
                    navigator.clipboard.writeText(content).then(() => this.showToast('Copied to clipboard', 'success'));
                },

                showToast(message, type) {
                    const id = Date.now();
                    this.toasts.push({ id, message, type, visible: true });
                    setTimeout(() => this.toasts = this.toasts.filter(t => t.id !== id), 3000);
                },

                fetchFiles() {
                    axios.get('/api/files').then(res => {
                        this.files = res.data;
                        this.isLoading = false;
                    });
                },

                fetchStats() {
                    axios.get('/api/stats').then(res => { this.stats = res.data; });
                },

                timeAgo(dateStr) {
                    const diff = (new Date() - new Date(dateStr)) / 1000;
                    if (diff < 60) return 'Just now';
                    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                    return Math.floor(diff / 86400) + 'd ago';
                },

                getFileIcon(fn) {
                    const ext = fn.split('.').pop().toLowerCase();
                    const map = {
                        'pdf': 'fa-solid fa-file-pdf',
                        'jpg': 'fa-solid fa-image', 'png': 'fa-solid fa-image', 'gif': 'fa-solid fa-image',
                        'zip': 'fa-solid fa-file-zipper', 'rar': 'fa-solid fa-file-zipper',
                        'mp4': 'fa-solid fa-file-video', 'mov': 'fa-solid fa-file-video',
                        'mp3': 'fa-solid fa-file-audio', 'wav': 'fa-solid fa-file-audio',
                        'txt': 'fa-solid fa-file-lines', 'doc': 'fa-solid fa-file-word', 'docx': 'fa-solid fa-file-word',
                        'go': 'fa-brands fa-golang',
                        'html': 'fa-brands fa-html5',
                        'css': 'fa-brands fa-css3',
                        'js': 'fa-brands fa-js'
                    };
                    return map[ext] || 'fa-solid fa-file';
                }
            }
        }
    </script>
</body>
</html>
