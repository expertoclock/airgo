<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirGo | Midnight Edition</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        slate: { 850: '#151f32', 900: '#0f172a', 950: '#020617' },
                        indigo: { 950: '#1e1b4b' },
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }

        body {
            background-color: #020617;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        .hero-glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body x-data="airgoApp()">

    <div class="max-w-6xl mx-auto px-6 py-8 min-h-screen flex flex-col">

        <!-- Navbar -->
        <nav class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-4 cursor-pointer" @click="fetchStats(); fetchFiles()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500/20 to-purple-500/20 border border-white/10 flex items-center justify-center">
                    <i class="fa-solid fa-wind text-indigo-400"></i>
                </div>
                <span class="font-display font-bold text-xl tracking-tight text-white">AirGo</span>
            </div>

            <div class="flex items-center gap-6">
                <div class="hidden md:flex items-center gap-6 text-xs font-medium text-slate-400">
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"></span>
                        <span x-text="stats.uptime"></span>
                    </div>
                    <span class="text-slate-600">|</span>
                    <span x-text="stats.total_size || '0 B'"></span>
                </div>
                <button @click="showQRModal = true" class="px-5 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-sm font-medium transition-all text-white flex items-center gap-2">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <span>Connect</span>
                </button>
            </div>
        </nav>

        <!-- Hero Upload Section -->
        <div class="mb-16">
            <div
                class="hero-glass rounded-3xl p-1 relative group transition-all duration-500"
                @dragover.prevent="isDragging = true"
                @dragleave.prevent="isDragging = false"
                @drop.prevent="handleDrop($event)"
                :class="{'ring-2 ring-indigo-500 shadow-[0_0_40px_rgba(99,102,241,0.2)]': isDragging}"
            >
                <div class="bg-slate-900/40 rounded-[20px] py-16 px-8 text-center border border-dashed border-slate-700/50 group-hover:border-indigo-500/50 transition-colors relative overflow-hidden">
                    <input type="file" id="fileInput" class="hidden" @change="handleFileSelect($event)">

                    <!-- Decor -->
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-indigo-500 to-transparent opacity-20"></div>

                    <div x-show="!uploading" class="relative z-10">
                        <!-- Cloud Icon -->
                        <div class="w-24 h-24 mx-auto mb-8 rounded-full bg-indigo-500/5 border border-indigo-500/10 flex items-center justify-center shadow-[0_0_30px_rgba(99,102,241,0.05)] animate-float cursor-pointer hover:bg-indigo-500/10 transition-colors" @click="document.getElementById('fileInput').click()">
                            <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-400 drop-shadow-[0_0_10px_rgba(129,140,248,0.5)]"></i>
                        </div>

                        <h2 class="font-display font-bold text-3xl text-white mb-3">Share Without Limits</h2>
                        <p class="text-slate-400 max-w-md mx-auto mb-8 leading-relaxed">
                            Drag your files into this zone or <button class="text-indigo-400 hover:text-indigo-300 font-medium underline underline-offset-4 decoration-indigo-500/30 transition-all" @click="document.getElementById('fileInput').click()">select manually</button>.
                        </p>
                    </div>

                    <!-- Progress -->
                    <div x-show="uploading" class="max-w-md mx-auto py-8">
                        <div class="flex justify-between text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-2">
                            <span>Uploading</span>
                            <span x-text="progress + '%'"></span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-indigo-500 h-full rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(99,102,241,0.5)]" :style="`width: ${progress}%`"></div>
                        </div>
                        <p class="mt-4 text-sm text-slate-500 truncate font-mono" x-text="currentFileName"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="text-sm font-medium text-slate-400">
                <span x-text="filteredFiles.length"></span> files stored
            </div>

            <div class="flex gap-4 w-full md:w-auto">
                <div class="relative flex-1 md:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 text-xs"></i>
                    <input type="text" x-model="search" placeholder="Filter..." class="w-full bg-white/5 border border-white/5 rounded-lg py-2 pl-9 pr-3 text-sm text-white focus:outline-none focus:border-indigo-500/50 focus:bg-white/10 transition-all placeholder-slate-600">
                </div>

                <div class="flex bg-white/5 rounded-lg p-1 border border-white/5">
                    <button @click="viewMode = 'grid'" class="px-3 rounded-md transition-all text-sm" :class="viewMode === 'grid' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'"><i class="fa-solid fa-grip"></i></button>
                    <button @click="viewMode = 'list'" class="px-3 rounded-md transition-all text-sm" :class="viewMode === 'list' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'"><i class="fa-solid fa-list"></i></button>
                </div>
            </div>
        </div>

        <!-- Batch Actions -->
        <div x-show="selectedFiles.length > 0" x-transition class="fixed bottom-8 left-1/2 -translate-x-1/2 z-40 bg-slate-900 border border-white/10 rounded-full px-6 py-3 shadow-2xl flex items-center gap-6 backdrop-blur-xl">
            <span class="text-sm font-bold text-white"><span x-text="selectedFiles.length"></span> selected</span>
            <div class="h-4 w-px bg-white/10"></div>
            <button @click="batchDelete" class="text-red-400 hover:text-white text-sm font-medium transition-colors flex items-center gap-2">
                <i class="fa-regular fa-trash-can"></i> Delete
            </button>
            <button @click="selectedFiles = []" class="text-slate-500 hover:text-white text-sm transition-colors"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- File Grid -->
        <div class="relative min-h-[300px]">
            <div x-show="isLoading" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <template x-for="i in 10"><div class="aspect-[4/3] bg-white/5 rounded-2xl animate-pulse"></div></template>
            </div>

            <div x-show="!isLoading" :class="viewMode === 'grid' ? 'grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6' : 'space-y-3'">
                <template x-for="file in filteredFiles" :key="file.name">
                    <div class="glass-card rounded-2xl p-5 group relative cursor-pointer flex flex-col items-center justify-center text-center aspect-[4/3]"
                         :class="{'ring-2 ring-indigo-500 bg-indigo-500/10': selectedFiles.includes(file.name), '!aspect-auto !flex-row !justify-start !text-left !p-4': viewMode === 'list'}"
                         @click="toggleSelect(file.name)">

                         <!-- Checkbox (Hidden unless selected or hovered) -->
                         <div class="absolute top-3 left-3 opacity-0 group-hover:opacity-100 transition-opacity" :class="{'opacity-100': selectedFiles.includes(file.name)}">
                             <div class="w-5 h-5 rounded border border-white/20 flex items-center justify-center transition-colors" :class="selectedFiles.includes(file.name) ? 'bg-indigo-500 border-indigo-500' : 'bg-slate-900/50'">
                                 <i class="fa-solid fa-check text-[10px]" x-show="selectedFiles.includes(file.name)"></i>
                             </div>
                         </div>

                        <!-- Icon -->
                        <div class="mb-4 text-3xl transition-transform duration-300 group-hover:scale-110 drop-shadow-lg" :class="{ '!mb-0 !mr-4 !text-2xl': viewMode === 'list' }">
                            <i :class="[getFileIcon(file.name), getFileColor(file.name)]"></i>
                        </div>

                        <!-- Info -->
                        <div class="min-w-0 w-full">
                            <h4 class="text-sm font-medium text-slate-200 truncate px-2" x-text="file.name"></h4>
                            <p class="text-[10px] text-slate-500 mt-1 font-mono uppercase tracking-wide" x-text="file.size"></p>
                        </div>

                        <!-- Hover Overlay -->
                        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-all duration-300 rounded-2xl flex items-center justify-center gap-2" @click.stop>
                             <a :href="file.url" download class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition-transform hover:scale-110">
                                <i class="fa-solid fa-download text-sm"></i>
                            </a>
                            <button @click="copyToClipboard(file.url)" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center border border-white/10 backdrop-blur-md transition-transform hover:scale-110">
                                <i class="fa-regular fa-copy text-sm"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="filteredFiles.length === 0 && !isLoading" class="text-center py-20 opacity-30">
                <i class="fa-solid fa-box-open text-6xl mb-4 text-slate-600"></i>
                <p class="text-slate-500 text-lg">Repository Empty</p>
            </div>
        </div>

    </div>

    <!-- QR Modal -->
    <div x-show="showQRModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" @click.self="showQRModal = false">
        <div class="bg-slate-900 border border-white/10 p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl relative">
            <button @click="showQRModal = false" class="absolute top-4 right-4 text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="font-display font-bold text-2xl text-white mb-2">Mobile Link</h3>
            <p class="text-slate-500 text-sm mb-6">Scan to access on local network</p>
            <div class="bg-white p-4 rounded-2xl inline-block mb-6"><div id="qrcode"></div></div>
            <div class="bg-slate-950 py-3 px-4 rounded-xl border border-white/5 break-all cursor-pointer hover:border-indigo-500/50 transition-colors" @click="copyToClipboard(window.location.href)">
                <p class="text-indigo-400 font-mono text-xs" x-text="window.location.href"></p>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.visible"
                 x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-8" x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 opacity-0"
                 class="bg-slate-900/90 border border-white/10 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 backdrop-blur-md">
                <i :class="toast.type === 'success' ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-circle-xmark text-red-500'"></i>
                <span class="text-sm font-medium text-white shadow-black drop-shadow-md" x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <script>
        function airgoApp() {
            return {
                files: [], search: '', stats: {}, isDragging: false,
                uploading: false, progress: 0, currentFileName: '', isLoading: true,
                toasts: [], showQRModal: false, viewMode: 'grid', selectedFiles: [],

                init() {
                    this.refreshAll();
                    setInterval(() => { this.fetchStats(); this.fetchFiles(); }, 5000);

                    this.$watch('showQRModal', (val) => {
                        if (val) {
                            this.$nextTick(() => {
                                document.getElementById('qrcode').innerHTML = "";
                                new QRCode(document.getElementById("qrcode"), {
                                    text: window.location.href, width: 180, height: 180,
                                    colorDark: "#0f172a", colorLight: "#ffffff",
                                    correctLevel: QRCode.CorrectLevel.M
                                });
                            });
                        }
                    });
                },

                refreshAll() { this.fetchFiles(); this.fetchStats(); },

                get filteredFiles() {
                    if (!this.search) return this.files;
                    return this.files.filter(f => f.name.toLowerCase().includes(this.search.toLowerCase()));
                },

                toggleSelect(name) {
                    if (this.selectedFiles.includes(name)) {
                        this.selectedFiles = this.selectedFiles.filter(i => i !== name);
                    } else {
                        this.selectedFiles.push(name);
                    }
                },

                handleDrop(e) {
                    this.isDragging = false;
                    if (e.dataTransfer.files.length) this.uploadFile(e.dataTransfer.files[0]);
                },

                handleFileSelect(e) {
                    if (e.target.files.length) this.uploadFile(e.target.files[0]);
                },

                uploadFile(file) {
                    this.uploading = true;
                    this.progress = 0;
                    this.currentFileName = file.name;

                    const fd = new FormData();
                    fd.append('file', file);

                    axios.post('/api/upload', fd, {
                        onUploadProgress: (p) => this.progress = Math.round((p.loaded * 100) / p.total)
                    })
                    .then(() => {
                        this.showToast('Upload Successful', 'success');
                        this.refreshAll();
                    })
                    .catch(() => this.showToast('Upload Failed', 'error'))
                    .finally(() => setTimeout(() => this.uploading = false, 800));
                },

                batchDelete() {
                    if (!confirm(`Delete ${this.selectedFiles.length} files?`)) return;

                    Promise.all(this.selectedFiles.map(name => axios.delete(`/api/files/${name}`)))
                        .then(() => {
                            this.showToast(`${this.selectedFiles.length} files deleted`, 'success');
                            this.selectedFiles = [];
                            this.refreshAll();
                        });
                },

                copyToClipboard(text) {
                    const content = text.startsWith('/') ? window.location.origin + text : text;
                    navigator.clipboard.writeText(content).then(() => this.showToast('Copied to Clipboard', 'success'));
                },

                showToast(message, type) {
                    const id = Date.now();
                    this.toasts.push({ id, message, type, visible: true });
                    setTimeout(() => this.toasts = this.toasts.filter(t => t.id !== id), 3000);
                },

                fetchFiles() {
                    axios.get('/api/files').then(res => {
                        this.files = res.data;
                        this.isLoading = false;
                    });
                },

                fetchStats() {
                    axios.get('/api/stats').then(res => { this.stats = res.data; });
                },

                timeAgo(dateStr) {
                    const diff = (new Date() - new Date(dateStr)) / 1000;
                    if (diff < 60) return 'Just now';
                    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                    return Math.floor(diff / 86400) + 'd ago';
                },

                getFileIcon(fn) {
                    const ext = fn.split('.').pop().toLowerCase();
                    const map = {
                        'pdf': 'fa-solid fa-file-pdf',
                        'jpg': 'fa-solid fa-image', 'png': 'fa-solid fa-image', 'gif': 'fa-solid fa-image',
                        'zip': 'fa-solid fa-file-zipper', 'rar': 'fa-solid fa-file-zipper',
                        'mp4': 'fa-solid fa-file-video', 'mov': 'fa-solid fa-file-video',
                        'mp3': 'fa-solid fa-file-audio', 'wav': 'fa-solid fa-file-audio',
                        'txt': 'fa-solid fa-file-lines', 'doc': 'fa-solid fa-file-word', 'docx': 'fa-solid fa-file-word',
                        'go': 'fa-brands fa-golang',
                        'html': 'fa-brands fa-html5',
                        'css': 'fa-brands fa-css3',
                        'js': 'fa-brands fa-js'
                    };
                    return map[ext] || 'fa-solid fa-file';
                },

                getFileColor(fn) {
                    const ext = fn.split('.').pop().toLowerCase();
                    const map = {
                        'pdf': 'text-red-400',
                        'jpg': 'text-purple-400', 'png': 'text-purple-400',
                        'zip': 'text-amber-400',
                        'mp4': 'text-pink-400',
                        'mp3': 'text-emerald-400',
                        'txt': 'text-slate-400',
                        'go': 'text-cyan-400',
                    };
                    return map[ext] || 'text-indigo-400';
                }
            }
        }
    </script>
</body>
</html>
