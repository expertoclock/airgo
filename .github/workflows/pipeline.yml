name: CI/CD Pipeline

# Triggers: When does this pipeline run?
# We trigger this workflow only when code is pushed to the 'main' branch.
on:
  push:
    branches:
      - main

jobs:
  # Job 1: Quality Control
  # This job ensures the code is correct and passes tests before we try to build it.
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest # Run on a standard Linux virtual machine provided by GitHub

    steps:
      # Step 1: Check out the repository code so the runner can access it.
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install and configure the Go programming language environment.
      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Specify the Go version to match our Dockerfile

      # Step 3: Run 'go vet' to analyze code for potential errors (static analysis).
      # "./..." tells Go to check the root directory and all subdirectories.
      - name: Run Static Analysis (go vet)
        run: go vet ./...

      # Step 4: Run unit tests to ensure code logic is correct.
      # If any test fails, the pipeline stops here.
      - name: Run Unit Tests
        run: go test ./...

  # Job 2: Build & Publish (Docker)
  # This job builds the container image and pushes it to DockerHub.
  build-and-publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    
    # 'needs' ensures this job ONLY runs if 'quality-control' passes successfully.
    needs: quality-control

    steps:
      # We need to checkout the code again in this new job/runner.
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Log in to Docker Hub using secure secrets stored in the repository settings.
      # This is required to push images to your account.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Set up Docker Buildx, a tool that extends Docker builds (optional but recommended for caching/multi-arch).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3 & 4: Build the image from the Dockerfile and push it to Docker Hub.
      # We tag the image as 'latest' so it's the default when users pull it.
      # Note: We replace 'my-app' with the repository name. 
      # We assume the image name is the same as the username/airgo.
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .                # The build context is the current directory
          file: ./Dockerfile        # The path to our Dockerfile
          push: true                # We want to push the result to the registry
          tags: ${{ secrets.DOCKER_USERNAME }}/airgo:latest
